# omop-agent on one server: PostgreSQL 16 and the review web app.
#
#   cd deploy
#   cp .env.example .env        # then set the passwords and keys in .env
#   mkdir -p projects data athena source
#   docker compose up -d --build
#   docker compose run --rm app users add YOUR-NAME --role operator
#
# Then open http://127.0.0.1:8000 on the server (or through your HTTPS reverse proxy).
# Full instructions: docs/deploy.md. Patient data never leaves this server. The LLM runs here too
# (the optional "llm" service, a llama.cpp server: docker compose --profile llm up -d); only a
# project with llm.provider "anthropic" sends aggregates to the Claude API.
name: omop-agent

services:
  db:
    image: ${POSTGRES_IMAGE:-postgres:16}
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      OMOP_DB_PASSWORD: ${OMOP_DB_PASSWORD:?set OMOP_DB_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    shm_size: 1g  # vocabulary loads build large indexes
    healthcheck:
      # Over TCP: during first-time setup the server listens only on its socket, so this stays
      # unhealthy until the omop role and database exist.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d omop"]
      interval: 5s
      timeout: 5s
      retries: 30
    # Not published on the host. To reach it from the server itself, add:
    # ports: ["127.0.0.1:5432:5432"]

  app:
    build:
      context: ..
      # Dockerfile.r adds R, Achilles and the official DataQualityDashboard (about 1 GB more).
      dockerfile: ${OMOP_AGENT_DOCKERFILE:-Dockerfile}
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:-python:3.12-slim}
        UBUNTU_IMAGE: ${UBUNTU_IMAGE:-ubuntu:24.04}
    image: omop-agent:${OMOP_AGENT_IMAGE_TAG:-local}
    restart: unless-stopped
    init: true  # reaps the processes of finished pipeline runs
    depends_on:
      db:
        condition: service_healthy
    # Run as your own user so the files under projects/ stay editable on the server.
    user: "${OMOP_AGENT_UID:-10001}:${OMOP_AGENT_GID:-10001}"
    environment:
      OMOP_AGENT_DB_URL: postgresql://omop:${OMOP_DB_PASSWORD}@db:5432/omop
      # Projects created with `init` use these for llm.base_url and llm.model.
      OMOP_AGENT_LLM_URL: ${OMOP_AGENT_LLM_URL:-http://llm:8080/v1}
      OMOP_AGENT_LLM_MODEL: ${LLM_MODEL_NAME:-gpt-oss-120b}
      OMOP_AGENT_LLM_API_KEY: ${OMOP_AGENT_LLM_API_KEY:-}
      # Projects created with `init` share this memory of reviewed mappings.
      OMOP_AGENT_MAPPING_MEMORY: /srv/data/mapping_memory.sqlite
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ATHENA_DOWNLOAD_URL: ${ATHENA_DOWNLOAD_URL:-}
      OMOP_AGENT_WEB_SECRET: ${OMOP_AGENT_WEB_SECRET:-}
      OMOP_AGENT_SECURE_COOKIES: ${OMOP_AGENT_SECURE_COOKIES:-false}
      # Inside the container every client appears to come from Docker's gateway, so the address
      # your reverse proxy reports (X-Forwarded-For) is trusted. Safe while the port is bound to
      # 127.0.0.1 (only programs on this server can connect); see docs/deploy.md otherwise.
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-*}
      HOME: /tmp
    volumes:
      - ./projects:/srv/projects  # one sub-directory per project (omop_agent.yaml + work/)
      - ./data:/srv/data          # accounts, session key, sign-in log
      - ./athena:/srv/athena      # the unpacked Athena vocabulary download
      - ./source:/srv/source:ro   # source CSV exports (read-only)
    ports:
      - "${OMOP_AGENT_BIND:-127.0.0.1}:${OMOP_AGENT_PORT:-8000}:8000"

  # The self-hosted open-weight model (llama.cpp's llama-server, CPU). Off unless started with
  #   docker compose --profile llm up -d
  # Put the GGUF weights in models/ (see docs/local-llm.md). Reachable only from the app
  # container (no port is published), at http://llm:8080/v1.
  llm:
    image: ${LLAMA_CPP_IMAGE:-ghcr.io/ggml-org/llama.cpp:server}
    profiles: ["llm"]
    restart: unless-stopped
    volumes:
      - ./models:/models:ro
    command:
      - -m
      - /models/${LLM_MODEL_FILE:-gpt-oss-120b-MXFP4.gguf}
      - --alias
      - ${LLM_MODEL_NAME:-gpt-oss-120b}
      - --jinja
      - -c
      - "${LLM_CONTEXT:-32768}"
      - -np
      - "1"
      - --host
      - 0.0.0.0
      - --port
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/health || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 15m  # loading 60+ GB of weights from disk takes a while
      retries: 5

volumes:
  pgdata:
