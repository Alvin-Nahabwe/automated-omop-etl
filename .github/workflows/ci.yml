name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: omop
          POSTGRES_PASSWORD: omop
          POSTGRES_DB: omop_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U omop"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      OMOP_AGENT_TEST_DB_URL: postgresql://omop:omop@localhost:5432/omop_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Enable pg_trgm
        run: PGPASSWORD=omop psql -h localhost -U omop -d omop_test -c "CREATE EXTENSION IF NOT EXISTS pg_trgm"
      - name: Tests
        run: pytest -q
      - name: Offline end-to-end demo (recorded LLM answers)
        run: omop-agent demo /tmp/omop-demo --db-url "$OMOP_AGENT_TEST_DB_URL"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: demo-report
          path: |
            /tmp/omop-demo/work/report.html
            /tmp/omop-demo/work/report.md
            /tmp/omop-demo/work/etl_spec.md
            /tmp/omop-demo/work/dq_results.json
            /tmp/omop-demo/work/sql/

  docker:
    # Builds the image and runs the offline demo inside the deploy/ bundle, as an install would.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: deploy
    steps:
      - uses: actions/checkout@v4
      - name: Configure the bundle
        run: |
          cp .env.example .env
          sed -i "s/^POSTGRES_PASSWORD=$/POSTGRES_PASSWORD=$(openssl rand -hex 16)/; s/^OMOP_DB_PASSWORD=$/OMOP_DB_PASSWORD=$(openssl rand -hex 16)/" .env
          mkdir -p projects data athena source
          sudo chown 10001:10001 projects data athena
      - name: Build and start
        run: docker compose up -d --build --wait
      - name: Offline demo inside the bundle
        run: docker compose run --rm -T app demo /srv/projects/demo
      - name: Web app answers
        run: |
          printf 'ci-password-1234\n' | docker compose run --rm -T app users add ci --role operator --password-stdin
          curl -fsS http://127.0.0.1:8000/healthz
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/login)" = 200
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/p/demo)" = 303
      - name: Logs
        if: failure()
        run: docker compose logs
