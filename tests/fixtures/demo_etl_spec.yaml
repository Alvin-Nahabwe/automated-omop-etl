    kind: column
    expression: r.test
    vocabulary: null
    target_domain: null
    concept_role: standard
    rationale: ''
  - target_field: unit_source_value
    kind: column
    expression: r.unit
    vocabulary: null
    target_domain: null
    concept_role: standard
    rationale: ''
  - target_field: value_source_value
    kind: column
    expression: r.result
    vocabulary: null
    target_domain: null
    concept_role: standard
    rationale: ''
  rationale: Lab results and vital signs; both are Measurement domain in OMOP.
