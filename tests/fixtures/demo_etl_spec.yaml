# Reference ETL spec for the demo dataset (contains two deliberate bugs for the repair loop).
version: 1
cdm_version: '5.4'
person_key:
  table: individuals
  expression: individual_id
visit_key:
  table: clinic_visits
  expression: visit_id
observation_period: table_mapping
observation_period_type_concept_id: 32817
table_mappings:
- target_table: person
  source:
    table: individuals
    alias: i
  joins: []
  where: null
  fields:
  - target_field: person_id
    kind: person_id
    expression: i.individual_id
    vocabulary: null
    target_domain: null
    concept_role: standard
    rationale: Patient key resolved through the person id map.
  - target_field: gender_concept_id
    kind: expression
    expression: CASE i.sex WHEN '1' THEN 8507 WHEN '2' THEN 8532 ELSE 0 END
    vocabulary: null
    target_domain: null
    concept_role: standard
    rationale: 'HDSS sex codes: 1=male (8507), 2=female (8532), 9=unknown (0).'
  - target_field: year_of_birth
    kind: expression
    expression: EXTRACT(YEAR FROM to_date(i.dob, 'DD/MM/YYYY'))::int
    vocabulary: null
    target_domain: null
    concept_role: standard
    rationale: dob is written day-first (dd/mm/yyyy).
  - target_field: month_of_birth
    kind: expression
    expression: EXTRACT(MONTH FROM to_date(i.dob, 'DD/MM/YYYY'))::int
    vocabulary: null
    target_domain: null
    concept_role: standard
    rationale: ''
  - target_field: day_of_birth
    kind: expression
    expression: EXTRACT(DAY FROM to_date(i.dob, 'DD/MM/YYYY'))::int
    vocabulary: null
    target_domain: null
    concept_role: standard
    rationale: ''
  - target_field: birth_datetime
    kind: expression
    expression: to_date(i.dob, 'DD/MM/YYYY')::timestamp
    vocabulary: null
    target_domain: null
    concept_role: standard
    rationale: ''
  - target_field: race_concept_id
    kind: constant
    expression: '0'
    vocabulary: null
    target_domain: null
    concept_role: standard
    rationale: Race is not collected.
  - target_field: ethnicity_concept_id
    kind: constant
    expression: '0'
    vocabulary: null
    target_domain: null
    concept_role: standard
    rationale: Ethnicity is not collected.
  - target_field: person_source_value
    kind: column
    expression: i.individual_id
    vocabulary: null
    target_domain: null
    concept_role: standard
    rationale: ''
  - target_field: gender_source_value
    kind: column
    expression: i.sex
    vocabulary: null
    target_domain: null
    concept_role: standard
    rationale: ''
  - target_field: gender_source_concept_id
    kind: constant
    expression: '0'
    vocabulary: null
    target_domain: null
    concept_role: standard
    rationale: ''
  rationale: One row per registered HDSS individual.
- target_table: observation_period
  source:
    table: residency_episodes
    alias: r
  joins: []
  where: null
  fields:
  - target_field: observation_period_id
    kind: auto_id
    expression: null
    vocabulary: null
    target_domain: null
    concept_role: standard
    rationale: Surrogate key.
  - target_field: person_id
    kind: person_id
    expression: r.individual_id
    vocabulary: null
    target_domain: null
    concept_role: standard
    rationale: Patient key resolved through the person id map.
  - target_field: observation_period_start_date
    kind: expression
    expression: r.start_date::date
    vocabulary: null
    target_domain: null
    concept_role: standard
    rationale: ''
  - target_field: observation_period_end_date
    kind: expression
    expression: r.end_date::date
    vocabulary: null
    target_domain: null
    concept_role: standard
    rationale: ''
  - target_field: period_type_concept_id
    kind: constant
    expression: '32817'
    vocabulary: null
    target_domain: null
    concept_role: standard
    rationale: Type concept for the surveillance/clinic record.
  rationale: HDSS residency episodes are the periods during which events would be captured.
- target_table: visit_occurrence
  source:
    table: clinic_visits
    alias: v
  joins: []
  where: null
  fields:
  - target_field: visit_occurrence_id
    kind: visit_id
    expression: v.visit_id
    vocabulary: null
    target_domain: null
    concept_role: standard
    rationale: Visit key resolved through the visit id map.
  - target_field: person_id
    kind: person_id
    expression: v.individual_id
    vocabulary: null
    target_domain: null
    concept_role: standard
    rationale: Patient key resolved through the person id map.
  - target_field: visit_concept_id
    kind: expression
    expression: CASE v.visit_type WHEN 'OPD' THEN 9202 WHEN 'IPD' THEN 9201 WHEN 'EMERG' THEN 9203 ELSE 0 END
    vocabulary: null
    target_domain: null
    concept_role: standard
    rationale: OPD=Outpatient, IPD=Inpatient, EMERG=Emergency Room.
  - target_field: visit_start_date
    kind: expression
    expression: v.visit_date::date
    vocabulary: null
    target_domain: null
    concept_role: standard
    rationale: ''
  - target_field: visit_start_datetime
    kind: expression
    expression: v.visit_date::timestamp
    vocabulary: null
    target_domain: null
    concept_role: standard
    rationale: ''
  - target_field: visit_end_date
    kind: expression
    expression: v.discharge_date::date
    vocabulary: null
    target_domain: null
    concept_role: standard
    rationale: Discharge date closes the visit.
  - target_field: visit_type_concept_id
    kind: constant
    expression: '32817'
    vocabulary: null
    target_domain: null
    concept_role: standard
    rationale: EHR record from the clinic system (32817).
  - target_field: visit_source_value
    kind: column
    expression: v.visit_type
    vocabulary: null
    target_domain: null
    concept_role: standard
    rationale: ''
  rationale: One row per clinic visit.
